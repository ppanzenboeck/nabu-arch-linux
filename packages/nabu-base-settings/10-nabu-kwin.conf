# Xiaomi Pad 5 (Qualcomm Adreno 640 / Freedreno) KDE Plasma Wayland configuration
# Forces KWin to use the OpenGL ES compositor backend (O2ES) instead of Desktop GL Core profile.
# This prevents Adreno CCU (Color Cache Unit) translation faults and the recurring
# "A graphics reset attributable to the current GL context occurred" crash dialog on login.
KWIN_COMPOSE=O2ES
